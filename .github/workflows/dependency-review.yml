name: dependency-review

# Reads the dependency diff a pull request introduces and refuses known-vulnerable
# additions and licences this repository cannot ship.
#
# ⚠️ This workflow needs the repository's **Dependency graph** enabled, under
# Settings → Code security. Without it the action stops at "Dependency review is
# not supported on this repository" before looking at anything -- which is how
# its first run went. Dependabot opening version pull requests is not evidence
# the graph is on: those are driven from the manifest directly.
#
# This is deliberately not `pnpm audit`. Audit answers "is anything in the tree
# vulnerable today", which on a pull request mostly reports what `main` already
# had -- a finding the author of an unrelated change cannot act on and learns to
# scroll past. This one answers "does *this diff* add one", which is a question
# the person opening it can actually do something about. The tree-wide question
# is Dependabot's job, on its own schedule.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `comment-summary-in-pr` below needs this, and the first run without it would
  # have failed at the comment rather than at the finding. It grants nothing to a
  # pull request from a fork: GitHub hands those a read-only token whatever this
  # block says, so the summary appears on same-repo pull requests (Dependabot's,
  # in practice) and quietly does not on forks.
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v4
        with:
          # `moderate` matches the `audit` script in package.json. The two ask
          # different questions but they should not disagree about what counts
          # as bad enough to stop.
          fail-on-severity: moderate
          # This repository is Apache-2.0 and its image is redistributed. A
          # copyleft dependency arriving unnoticed is a licensing problem that
          # is far cheaper to catch in the pull request than after a release.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0, GPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
