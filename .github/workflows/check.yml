name: check

# What ran by hand until now. A deployment applies its own gate at push time, so
# it only sees a commit once somebody pushes the mirror -- sometimes days later.
# This closes the window at the commit instead of at the deploy.
#
# This file collects every verdict that belongs to a commit, one job per
# question, so that a red result names its own cause instead of being one job
# that failed for any of six reasons:
#
#   verify            the TypeScript: does it typecheck, does it build, do the
#                     `node --test` suites pass, on Node 24 and 26
#   deployment-gate   the schema surface, from a bare checkout with nothing
#                     installed, because that is how a deployment runs it
#   docker            the image, which resolves its dependencies differently
#                     than `verify` does and can break while it stays green
#   hooks             the python hook suites -- which `node --test` cannot see
#   shellcheck        the shell verifiers, same reason
#   policy            dependency review, secret scan, workflow audit, from the
#                     shared reusable workflow so five repositories agree
#   audit             the installed tree against published advisories -- which
#                     dependency review cannot answer, see that job
#   flake-watch       the suite three times over, on the schedule only
#   gate              collects the above; one of the two names the ruleset requires
#
# `codeql.yml` and `scorecard.yml` stay separate on purpose: their verdicts
# change when this code does not -- query packs update, repository settings
# drift -- so they run on their own schedules and carry their own verdicts.
# `codeql` is the ruleset's **second** required context; `scorecard` is not
# required, deliberately -- it is a scoreboard, and a scoreboard that blocks a
# merge stops being read and starts being worked around.
#
# ⚠️ This comment named `scripts.yml` and `docker.yml` as separate files for six
#    days after `#9` folded them in here, and then omitted `flake-watch` for two
#    days after `#27` added it. A list of siblings is exactly the kind of fact
#    that rots; `needs:` on the `gate` job below is the one that cannot -- and
#    `test/scripts/documented-counts.test.ts` now re-derives the READMEs,
#    `CONTRIBUTING.md` and `AGENTS.md` from that line, so the prose copies of
#    this list cannot rot silently any more. This comment still can.
on:
  push:
    branches: [main]
  pull_request:
  # **A verdict changes even when the code does not.** Images arrive under floating tags,
  # scanners gain rules, and a line that was quiet yesterday is caught today. A gate that
  # only runs on push and pull request cannot see any of that **until the next commit** —
  # and when it goes red then, the cause is looked for in that commit. Re-measuring the
  # same commit weekly separates the two by date.
  schedule:
    - cron: "13 5 * * 4"
  # 주기 실행을 기다리지 않고 부를 수 있어야 한다. 간헐을 좇는 중이라면 다음 목요일은
  # 너무 멀고, `flake-watch` 는 그 목적 하나로 존재한다.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref **per event** at a time; on a pull request, newest wins.
#
# Superseding was written when runs queued behind a self-hosted scale set that
# served roughly one job at a time: five pushes to main inside forty minutes
# left five runs queued, and the oldest was gating a commit four behind the tip
# by the time a runner reached it. Hosted runners took that queue away, and the
# setting stays for the reason that outlived it -- a superseded run is answering
# about a commit nobody will ship.
#
# That argument holds for a pull request, where a new commit really does replace
# the question. It does **not** hold for a push to main: cancelling there cost an
# intermediate commit its own verdict, which is a real loss for bisecting, and it
# bought nothing once the queue was gone. So superseding is now scoped to pull
# requests, and every commit that lands on main keeps its own answer.
#
# ⚠️ **The group carries `github.event_name`, and that is not cosmetic.** For a
# `push` to main, for `schedule`, and for `workflow_dispatch`, `github.ref` is
# `refs/heads/main` for all three -- one shared group. `flake-watch` budgets 45
# minutes and runs three legs, one of them on the slowest runner in the matrix,
# and it runs *only* on those last two events. With the event out of the group,
# any merge landing inside that window killed the whole scheduled run: the job
# most likely to be cancelled was the one job that only ever runs on the
# schedule, which defeats the reason it exists. At the merge rate here that is
# not a corner case.
#
# `cancel-in-progress` is now scoped to pull requests for the same reason. A new
# commit on a PR really does supersede the previous answer. A merge to main does
# not supersede a scheduled measurement of a *different* question.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything runs on GitHub-hosted runners.
#
# It used to be a self-hosted scale set, and for one commit this file split the
# two: push on the scale set, pull request on a hosted runner, because forks of
# a public repository can open a pull request and a self-hosted runner would
# execute that code inside the network the deployment lives in.
#
# That split is gone because it does not hold. For a `pull_request` GitHub runs
# the workflow as the pull request defines it, so a fork can edit this very file
# and point `runs-on` back at the scale set. A rule a stranger can rewrite is not
# a rule. Hosted for everything is the version that does not depend on nobody
# trying -- and it costs this repository nothing, because none of these checks
# reach the deployment's network.
jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung test would otherwise sit for six hours. Bounded, it reports.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # `engines` claims Node 24 and up, and nothing has ever run there: this
      # repository is developed on 26. A floor nobody stands on is a claim, not a
      # requirement -- so both ends run, and `fail-fast: false` keeps a failure on
      # one from hiding the other's result.
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. By default checkout leaves the job's
          # token in `.git/config` as an auth header, where every subsequent
          # step inherits it -- and the steps after this one run this
          # repository's own build, tests, and whatever those transitively
          # execute from `node_modules`. The token is read-only here, so the
          # exposure is small; it is also unnecessary, which is the whole
          # argument for turning it off.
          persist-credentials: false
      # A step installing `libatomic1` stood here. Node links against it from 25
      # on, the ARC image did not carry it, and setup-node treated that as a
      # warning rather than a failure -- so the 26 leg died at the first step
      # that actually wanted node. Hosted images carry the library, so the step
      # is gone. If this ever moves back to an image of our own, it comes back.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # `corepack enable` stood here, and on the 24 leg it still would work:
      # corepack ships with that release. Node 25 dropped it from the
      # distribution, so the 26 leg failed at `corepack: command not found`,
      # exit 127, on every run since the leg was added -- it has never once been
      # green. This action reads the same `packageManager` field corepack read,
      # so the pnpm version stays declared in exactly one place.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # A step in `verify` rather than a job of its own: this is the other half
      # of the question `pnpm check` asks -- is the source of this commit sound
      # -- and it wants the same checkout and the same `node_modules`. A separate
      # job would pay for a second install to answer half a question.
      #
      # It earned its place on the first run. `no-unsafe-finally` found a `throw`
      # inside the `finally` of `PostgresApplyLock.withZoneLock`, which replaced
      # whatever exception was already in flight: an apply failure followed by an
      # unlock failure reached the caller as the unlock failure, and the failure
      # that mattered was gone. `migrations.ts` had already decided this the
      # other way, with a test that says so by name. See `docs/linting.md`.
      - run: pnpm lint
      - run: pnpm run check:portal
      - run: pnpm build
      # TAP rather than the readable reporter, because the readable one keeps
      # every failure's reason for a final summary. A run that is cancelled or
      # killed before that summary prints leaves a bare "\u2716 <name>" and no way
      # to tell what was expected -- which is what happened on the run that
      # hung: the failing line was there, its reason never arrived. TAP says it
      # inline, at the moment of the failure, so a log that stops early still
      # carries the answer.
      - run: pnpm run test:ci

  # The schema-surface check is also the first half of a deployment's push gate,
  # which runs it straight from a checkout with nothing installed. The file
  # asserts that about its own imports, but an assertion about imports is not the
  # same as the thing running that way -- so it runs that way here. If this job
  # fails while `gate` passes, that deployment's gate has stopped working and
  # nobody there would have been told.
  deployment-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test test/infrastructure/schema-surface.test.ts

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # No registry credentials exist in this workflow and none should. A
          # pull request from a fork would otherwise be able to publish under
          # this repository's name by editing this file, which it is allowed to
          # do -- the workflow that runs for a `pull_request` is the one the
          # pull request defines.
          push: false
          # Keep it in the runner's docker daemon so the smoke step below can
          # actually run it. Without this the build result stays in buildx's
          # cache and `docker run` finds no such image.
          load: true
          tags: parallax:ci
          # GitHub's own cache backend. `mode=max` keeps the intermediate stages
          # too -- the `deps` stage in particular, which is a full `pnpm install`
          # that changes only when the lockfile does.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the image runs, and runs as nobody special
        # A build that succeeds proves the layers assembled. It does not prove
        # the entrypoint resolves, that `findPublicDirectory()` finds `public/`
        # from where the compiled entry point ended up, or that the unprivileged
        # uid the Dockerfile creates is the one the process gets. Three cheap
        # assertions, because "the image built" is a weaker claim than it sounds.
        run: |
          set -euo pipefail

          uid=$(docker run --rm --entrypoint id parallax:ci -u)
          echo "runtime uid: $uid"
          test "$uid" = "10001" || { echo "expected to run as uid 10001, got $uid"; exit 1; }

          # The portal's assets have to be reachable from the compiled entry
          # point's directory -- the Dockerfile's own comment explains the walk.
          docker run --rm --entrypoint ls parallax:ci -1 /app/public >/dev/null

          # `migrations/` stays root-owned and unwritable by the serving uid on
          # purpose: compromising the service must not let it plant SQL for a
          # later privileged `parallax migrate`. That is a security property of
          # the image, so it gets asserted rather than assumed.
          # ⚠️ This must distinguish "the write was refused" from "docker did not
          # run at all". It used to be a bare `if docker run ... 2>/dev/null`,
          # where *any* non-zero exit read as "the security property holds" --
          # image not found, daemon error, an entrypoint that cannot start. That
          # is a bad shape anywhere and a worse one here, because this is the one
          # assertion in this job stated as a security property.
          out="$(docker run --rm --entrypoint sh parallax:ci \
                   -c 'touch /app/migrations/evil.sql 2>&1 && echo WROTE' || true)"
          case "$out" in
            *WROTE*)
              echo "migrations/ is writable by the serving uid -- it must not be"
              exit 1 ;;
            *"Permission denied"*|*"Read-only file system"*)
              echo "refused as expected: $out" ;;
            *)
              echo "could not evaluate writability -- docker said: ${out:-<nothing>}"
              exit 1 ;;
          esac

  # `scripts/**/test-*.py` -- the hook guards.
  #
  # These are not unit tests. `test-pre-commit.py` stands up a throwaway git
  # repository in a temp directory and runs real `git commit` calls against it,
  # because how git invokes the hook -- and from which cwd -- is the entire
  # judgement being tested. So this job needs git configured with an identity,
  # and it needs to run somewhere the suites can create worktrees.
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `test-pre-commit.py` derives a base ref from the upstream branch and
          # falls back to the local tip. A depth-1 checkout leaves it deriving
          # from a history with one commit in it, which is not the shape the
          # suite is written against.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The suites use `ast` to read the hook's own source and check the
          # agent-environment list is what it claims. Nothing newer is needed.
          python-version: "3.12"

      - name: give the runner the git environment these suites assume
        # Three settings, each of which a developer's machine supplies without
        # anyone noticing and a runner does not. All three were found by running
        # this job, not by reading the suites -- which is the argument for the
        # job existing.
        run: |
          # 1. An identity. `git commit` refuses without one. The suites commit
          #    inside their own temp repositories, never this checkout.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. `init.defaultBranch`. `test-session-start-pull.py` builds its
          #    fixture as `git init --bare origin`, then pushes `main` to it and
          #    clones it. With this unset git names the bare repo's HEAD
          #    `refs/heads/master`, nothing ever creates that branch, and the
          #    clone checks out an empty tree -- "warning: remote HEAD refers to
          #    nonexistent ref". The suite then dies reading `work/A.md`, whose
          #    absence says nothing about the hook it is testing.
          #
          #    ⚠️ This is why the suite passes on a Mac and failed here: Apple's
          #    /Library/Developer/CommandLineTools/.../gitconfig sets it to
          #    `main` system-wide, so the fixture is silently correct there.
          git config --global init.defaultBranch main

          # 3. `refs/remotes/origin/HEAD`. `git clone` creates it; actions/checkout
          #    does not, because it fetches refs rather than cloning. The worktree
          #    the session-end suite creates resolves its base through origin/HEAD
          #    and dies on "fatal: invalid reference: origin/HEAD".
          git remote set-head origin --auto || git remote set-head origin main
          git symbolic-ref refs/remotes/origin/HEAD

      - name: run the hook suites
        # Every suite prints "실패 N 건" and exits non-zero on a failure, so the
        # loop can simply let a non-zero exit stop the step. `set -e` is on by
        # default in the `bash -e` shell Actions uses, but the loop would
        # swallow it -- hence the explicit exit.
        #
        # ⚠️ The suites' own docstrings warn that they must not inherit an agent
        # session's environment: `test-pre-commit.py` builds a "this is a human"
        # fixture, and a stray `CLAUDECODE` or `GROK_AGENT` in the environment
        # turns that fixture into an agent and the suite reports a failure that
        # is really about where it was run. A runner has none of those set, which
        # is exactly why this is the right place for them to run.
        #
        # Both directories are globbed. `scripts/git-hooks/test-pre-commit.py`
        # used to be named literally while its sibling directory was globbed, so
        # a second git-hook suite added later would simply not have run -- and
        # nothing would have said so. A glob that matches nothing still fails
        # loud here: there is no `nullglob`, so `python3` receives the literal
        # pattern, exits non-zero, and `status` becomes 1.
        run: |
          status=0
          for suite in scripts/claude-hooks/test-*.py scripts/git-hooks/test-*.py; do
            echo "::group::$suite"
            python3 "$suite" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # `scripts/*.sh` -- the verifiers `pnpm verify:integration` drives.
  #
  # Scoped to this repository's own shell scripts on purpose. `scripts/git-hooks/`
  # and `scripts/claude-hooks/` are a snapshot of stardust's and are kept
  # byte-identical there deliberately (see AGENTS.md); linting them here would
  # produce findings whose only available fix is to break the property that makes
  # drift checkable with one `cmp`. `scripts/git-hooks/pre-commit` is python
  # despite having no extension, and shellcheck errors out on it (SC1071), so the
  # glob would have to exclude it in any case.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        # `severity=warning` lets three long-standing `info` findings stand --
        # SC2015 in verify-dns.sh, SC2016 there too, SC2012 in verify-postgres.sh
        # -- all of which are correct as written for what those scripts do. The
        # bar is set where a finding means "fix this", so that a red result here
        # is worth reading. **Re-measured 2026-09-04 against 0.11.0: still those
        # three, still those files.**
        #
        # ⚠️ **Pinned by version and checksum, and it did not used to be.** This
        # step ran whatever shellcheck the `ubuntu-latest` image happened to ship,
        # which means a runner-image rollout could flip a *required* verdict red,
        # or quietly stop reporting a finding, with no commit anywhere. Printing
        # `--version` records that drift; it does not prevent it.
        #
        # This repository already paid for that lesson one file over. See
        # `policy-checks.yml`: gitleaks 8.24.3 read `.gitleaks.toml`, logged that
        # it had read it, and silently dropped the top-level `[[allowlists]]` it
        # did not understand -- twenty-seven fixtures came back as findings. The
        # version and SHA256 are pinned there now, and the same discipline
        # belongs here, on the tool that decides a required check.
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o /tmp/shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar xJf /tmp/shellcheck.tar.xz -C /tmp
          sc="/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$sc" --version
          # `scripts/git-hooks/install.sh` is in scope and its byte-identical
          # siblings are not, and that is not an inconsistency. AGENTS.md records
          # that installer as deliberately **divergent** from stardust's -- theirs
          # installs a `pre-push` hook that does not exist here -- so a finding in
          # it is actionable. The files that are kept byte-identical are excluded
          # because their only available fix would break the one property that
          # makes drift checkable with a single `cmp`.
          "$sc" --severity=warning scripts/*.sh scripts/git-hooks/install.sh

  # **The policy layer does not belong to this repository.** Credential scanning, workflow
  # auditing and dependency review ask the same question of all five repositories, whatever
  # each one builds. Kept as copies they drift, and once they drift nothing says which one
  # is the standard.
  #
  # A reusable workflow runs in the **caller's** context — the checkout is this repository
  # and `.gitleaks.toml` is this repository's. Each keeps its own allowlist with its reasons.
  #
  # ⚠️ Pinned by commit SHA. At `@main`, one line over there changes this gate.
  #    Dependabot updates this SHA.
  policy:
    uses: henryj-dev/.github/.github/workflows/policy-checks.yml@391d644e162cfd1290239b8a1681268dc865a80c
    permissions:
      contents: read
      # dependency-review says inside the pull request what was blocked and why.
      pull-requests: write
    secrets:
      # A licence is required for organisation-owned repositories. It is an org secret.
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # **이미 설치된 것에 대해 오늘 공표된 권고는 누구도 묻지 않고 있었다.**
  #
  # `policy` 의 `dependency-review` 는 **이 PR 이 무엇을 새로 끌고 들어오는가**만 답한다.
  # 기준점이 있어야 답할 수 있는 질문이라 `pull_request` 에서만 돌고, 그것이 옳다.
  # 하지만 그 질문은 「어제까지 조용하던 `pg` 버전에 오늘 CVE 가 붙었다」를 절대 잡지 못한다.
  # 이 저장소는 Cloudflare API 토큰을 쥔 컨트롤 플레인이고, 그 경우에 빨개지는 곳이
  # 아무 데도 없었다. Dependabot 보안 업데이트는 알림이지 게이트가 아니다.
  #
  # `package.json` 에 `audit` 스크립트는 처음부터 있었다. 부르는 곳이 없었을 뿐이다.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 하한선에서 잰다. 상한선에서만 재면 하한선이 끌어오는 트리는 아무도 안 본다.
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: pnpm install --frozen-lockfile
      # `moderate` 부터 막는다. 직접 의존이 셋뿐이라 전이 의존성의 소음에 파묻힐 트리가
      # 아니고, 그래서 `dependency-review` 가 `high` 로 잡은 선보다 여기를 낮게 둘 수 있다.
      - run: pnpm run audit

  # **간헐 실패는 코드가 그대로여도 판정이 바뀌는 종류다** — 이 워크플로가 주기 실행을 두고
  # 있는 이유와 같은 종류다. 그래서 여기 붙인다.
  #
  # `pnpm test` 가 2026-08-31 에 두 번, 각각 정확히 한 건씩 통과도 스킵도 아닌 상태로
  # 끝났다. 로컬 41회로 재현되지 않았고 이름을 잡지 못했다 — `docs/test-flakes.md` 가 그
  # 관찰과 배제된 가설을 들고 있다. 한 번 돌려서 안 나는 것을 세 번 돌려 본다.
  #
  # ⚠️ **PR 에는 붙지 않는다.** 관측 두 건으로 모든 PR 을 세 배로 만들면, 얻는 정보보다
  # 사람이 기다리는 시간이 먼저 는다. `if` 가 걸린 잡은 PR 에서 skipped 이고, `gate` 는
  # skipped 를 통과로 읽는다(그 잡의 주석이 그렇게 적어 놨다).
  #
  # 실패하면 어느 반복에서 났는지가 로그에 남는다. `test:ci` 가 TAP 이므로 실패의 이유가
  # 그 자리에 인라인으로 찍힌다 — 요약을 기다리다 잘리는 것이 1·2차 관찰의 구멍이었다.
  flake-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # ⚠️ 45 분은 넉넉한 값이 아니라 빠듯한 값이었다. `pnpm install` 에 전체 스위트 **세 번**,
    # 그중 한 다리는 matrix 에서 가장 느린 `macos-latest` 이고, `scripts/watchdog.ts` 는
    # 테스트 프로세스 하나에 180초를 허용하는데 파일이 80개다. 여기서 나는 타임아웃은
    # **쫓고 있는 간헐 실패와 구별되지 않는다** — 이 잡의 존재 이유를 정확히 훼손한다.
    timeout-minutes: 75
    strategy:
      # 한 다리의 실패가 다른 다리의 답을 가리면, 어느 환경의 문제인지가 사라진다.
      fail-fast: false
      matrix:
        include:
          # 🔑 **관찰이 난 환경.** 두 번 다 macOS arm64 · Node 26 이었고 CI 는 한 번도 보지
          #    못했다. ubuntu 만 뒤지는 것은 없던 자리를 뒤지는 것이다.
          - { os: macos-latest, node: 26 }
          # 아직 아무도 보지 않은 축. `engines` 의 하한선이고 `verify` 도 여기서 돈다.
          - { os: ubuntu-latest, node: 24 }
          # 지금 개발이 서 있는 곳. 세 다리가 갈리면 그 갈림이 곧 단서다.
          - { os: ubuntu-latest, node: 26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: pnpm install --frozen-lockfile
      - name: 스위트를 세 번 돌린다 (${{ matrix.os }} · node ${{ matrix.node }})
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::반복 $attempt"
            pnpm run test:ci
            echo "::endgroup::"
          done

  # The one check name the branch ruleset requires.
  #
  # Listing job names one by one means that the day a name changes, that required check
  # becomes a check that does not exist — and the protection quietly disappears. GitHub
  # says nothing when it happens. Collecting them here makes adding or removing a job a
  # one-line change to `needs:`, and leaves the ruleset alone.
  gate:
    name: gate
    needs: [verify, deployment-gate, docker, hooks, shellcheck, policy, audit, flake-watch]
    # This job must run even when something upstream is red. Otherwise it is a check that
    # never reported, the rule waits forever, and nothing records what broke.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads `needs` and nothing else. It checks nothing out, so it needs no scope at all --
    # and a job that holds a token it never uses is a job that hands one to whatever a
    # future step runs.
    permissions: {}
    steps:
      - name: every upstream job settled green
        # Never interpolate `${{ }}` into a `run:` body: it is substituted before the
        # shell reads the script, so a quote or a `$(...)` in the value becomes shell code.
        env:
          NEEDS: ${{ toJSON(needs) }}
          # **The allowlist is the whole point of this step.**
          #
          # This used to count only `failure` and `cancelled` as bad, which made every
          # `skipped` a pass with no questions asked. Today exactly one job legitimately
          # skips -- `flake-watch`, which runs on the schedule only -- and everything else
          # is unconditional, so the blanket rule happened to be correct.
          #
          # It was correct by coincidence, not by construction. An `if:` added to `verify`
          # or `docker` tomorrow would turn this gate green while saying nothing, and
          # GitHub reports nothing when a required check stops checking. `policy` is the
          # sharpest edge: it is a reusable workflow behind a SHA in another repository,
          # so an `if:` added *there* would convert this repository's whole policy layer
          # into a silent pass here.
          #
          # So the default is inverted: `success` passes, everything else fails, and a
          # job may skip only if it is named here. Adding a job that legitimately skips
          # is then a deliberate one-line edit rather than an omission nobody sees.
          ALLOWED_SKIP: '["flake-watch"]'
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          bad="$(jq --argjson skip "$ALLOWED_SKIP" '
            [to_entries[]
             | select(.value.result != "success")
             | select((.value.result == "skipped" and (.key | IN($skip[]))) | not)]
            | length' <<<"$NEEDS")"
          if test "$bad" != "0"; then
            jq -r --argjson skip "$ALLOWED_SKIP" '
              to_entries[]
              | select(.value.result != "success")
              | select((.value.result == "skipped" and (.key | IN($skip[]))) | not)
              | "::error::\(.key) settled \(.value.result)"' <<<"$NEEDS"
            echo "::error::$bad upstream job(s) did not pass"
            exit 1
          fi
          echo "gate passed"
