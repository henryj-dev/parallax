name: codeql

# Static analysis of the TypeScript that serves the API, the portal, and the
# DNS listener. `check.yml` answers "does it compile and do the tests pass";
# this answers a different question -- whether a path exists from something a
# stranger controls to something that matters. Neither substitutes for the
# other, so they are separate workflows with separate verdicts.
#
# The schedule matters more than the push trigger. CodeQL's query packs are
# updated continuously, so a weekly run over unchanged code finds things the
# run at commit time could not have known to look for.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 05:17 UTC. Off the hour on purpose -- GitHub's scheduler queues
    # the top of every hour heavily, and a cron at :00 can drift by tens of
    # minutes before a runner picks it up.
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Writing the results into the Security tab is the whole point; without
      # this the analysis runs and its answer goes nowhere.
      security-events: write
      contents: read
      # A pull request from a fork gets a read-only token, so the upload of its
      # results is deferred by GitHub and attached once the run is trusted.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes. Leaving the token in `.git/config` would
          # hand it to anything the analysis subsequently runs.
          persist-credentials: false

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # One language. `javascript-typescript` covers both the `src/` server
          # and the browser code under `public/`.
          languages: javascript-typescript
          # `security-extended` over the default suite: this is a control plane
          # that holds Cloudflare credentials and answers DNS, so the extra
          # queries' lower precision is a cost worth paying here.
          queries: security-extended

      # No build step. CodeQL extracts TypeScript without compiling it, and
      # `check.yml` already proves the project builds -- running `pnpm build`
      # again here would only add a way for this workflow to fail for a reason
      # that has nothing to do with security.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"

  # The one check name the branch ruleset requires. Naming the analysis job directly
  # means that the day the name changes, that required check becomes a check that does
  # not exist — and the protection quietly disappears.
  #
  # This asks whether the analysis ran, not whether it found nothing. Findings land in
  # the Security tab and do not block a merge; what is blocked is a broken query pack
  # going green while scanning nothing.
  codeql:
    name: codeql
    needs: [analyze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the analysis ran to completion
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          set -euo pipefail
          echo "analyze: $RESULT"
          test "$RESULT" = "success" \
            || { echo "::error::CodeQL analysis did not complete ($RESULT)"; exit 1; }
