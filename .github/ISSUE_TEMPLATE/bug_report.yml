name: Bug report
description: Something behaves differently than documented or than it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time.

        **If this is a security vulnerability, stop here** and use
        [private reporting](https://github.com/henryj-dev/parallax/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/henryj-dev/parallax/blob/main/.github/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what Parallax did instead of what you expected.
      placeholder: |
        Ran `parallax apply` after adding an A record to the internal view.
        The internal listener answered with the old address; Cloudflare took
        the change.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >
        Exact commands or requests, in order. Redact zone names, addresses, and
        tokens — `example.com` and `203.0.113.7` read fine.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >
        Errors, stack traces, or the DNS answer you got. Pasted here it is
        formatted as a code block automatically, so no backticks are needed.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: >
        The commit sha you are on (`git rev-parse --short HEAD`), or the image
        tag you pulled. There is no `--version` flag yet.
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Store
      description: >
        Which backing store the control plane was using — Postgres when
        `DATABASE_URL` is set, the single-node files when it is absent.
      options:
        - Postgres (DATABASE_URL set)
        - Files (DATABASE_URL absent)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Node version (`node -v`) or the image tag, the OS, and how it runs —
        container, systemd, a terminal. Include the config that seems relevant:
        what `HOST` and `PARALLAX_DNS_HOST` are bound to is often the answer.
      placeholder: |
        node v24.4.0, Debian 12, systemd
        HOST=0.0.0.0  PARALLAX_DNS_HOST=0.0.0.0  PARALLAX_DNS_PORT=53
    validations:
      required: true
